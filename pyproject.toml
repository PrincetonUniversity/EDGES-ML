[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edges-ml"
version = "0.1.0"
description = "A multi-code MHD simulation dataset builder for machine learning applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "h5py",
    "matplotlib",
    "termcolor",
    "pyyaml",
]

[project.optional-dependencies]
m3dc1  = ["fpy"]
nimrod = ["nimpy"]
imas   = ["imas"]
adios2 = ["adios2"]
all    = ["fpy", "nimpy", "imas", "adios2"]

[project.scripts]
edges-build-dataset = "edges_ml.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["edges_ml*"]
exclude = ["build*", "dist*", "tests*", "docs*"]
# IMPORTANT: without this, setuptools may pick up `edges_ml/` as an implicit
# namespace package.  An editable install then bakes that decision into the
# generated __editable___edges_ml_*_finder.py, so `import edges_ml` resolves to
# a location-less namespace module (__file__ is None, __init__.py never runs)
# and every top-level name such as GridSpec becomes unimportable.
namespaces = false
