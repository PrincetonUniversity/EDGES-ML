[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EDGES-ML"
version = "0.1.0"
description = "Extract data from extended-MHD simulation codes for use in machine learning applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "h5py",
    "matplotlib",
    "termcolor",
    "pyyaml",
]

[project.optional-dependencies]
m3dc1  = ["fpy"]
nimrod = ["nimpy"]
imas   = ["imas"]
adios2 = ["adios2"]
all    = ["fpy", "nimpy", "imas", "adios2"]

[project.scripts]
edges-build-dataset = "edges_ml.cli:main"

[tool.setuptools]
include-package-data = true
# The package list is given EXPLICITLY (rather than via packages.find) on
# purpose: if 'edges_ml/__init__.py' is missing, or the copied source tree is
# incomplete, the build then fails loudly instead of silently installing
# 'edges_ml' as an implicit NAMESPACE package. A namespace package imports
# fine but has '__file__ is None' and exports nothing, which surfaces as
# confusing errors such as:
#     AttributeError: module 'edges_ml' has no attribute 'GridSpec'
packages = ["edges_ml"]
