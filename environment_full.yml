# Conda environment for edges-ml with full support:
#   M3D-C1  (fpy / m3dc1)
#   NIMROD  (nimpy)
#   ADIOS2  (adios2)
#   IMAS    (imas-python)
#
# Packages NOT available on conda-forge / PyPI must be installed manually
# after creating the environment:
#
#   conda env create -f environment_full.yml
#   conda activate edges-ml-full
#
#   # M3D-C1 Python bindings (fusion-io + m3dc1 package)
#   pip install /path/to/fusion-io/python
#   pip install /path/to/m3dc1/python
#
#   # NIMROD Python bindings
#   pip install /path/to/nimpy
#
#   # IMAS Python bindings (imas-python / imas-core)
#   pip install /path/to/imas-python
#   # OR load via environment modules: module load imas
#
#   # edges-ml itself
#   pip install -e /path/to/edges-ml

name: edges-ml-full

channels:
  - conda-forge
  - defaults

dependencies:
  - python>=3.9
  - numpy
  - h5py
  - matplotlib
  - termcolor
  - pyyaml
  # ADIOS2 is available on conda-forge
  - adios2
  - pip
  - pip:
    # edges-ml itself (editable install from repo root)
    - -e .
